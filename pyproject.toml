[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-local"
version = "2.0.0"
description = "API privada para inferência local com Ollama"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "uvicorn==0.54.0",
]

[tool.setuptools.packages.find]
include = ["src*"]
